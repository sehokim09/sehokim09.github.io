<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — home">
      {% include rings.html %}
      <span class="brand-text">
        <span class="brand-name">{{ site.short_title }}</span>
        <span class="brand-sub">at UH Mānoa · {{ site.tagline }}</span>
      </span>
    </a>
    <nav class="main-nav" aria-label="Main">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="nav-join" href="{{ '/join/' | relative_url }}"{% if page.url == '/join/' %} aria-current="page"{% endif %}>Join the Lab</a>
    </nav>
  </div>
</header>
