{% assign p = include.pub %}
<li>
  <span class="pub-title">{{ p.title }}</span>
  <span class="pub-meta">{{ p.authors }}{% if p.venue %} · <em>{{ p.venue }}</em>{% endif %}{% if include.show_year %}, {{ p.year }}{% endif %}</span>
  {% if p.doi or p.pdf %}
  <span class="pub-links">
    {% if p.doi %}<a href="https://doi.org/{{ p.doi }}">DOI</a>{% endif %}
    {% if p.pdf %}<a href="{{ p.pdf | relative_url }}">PDF</a>{% endif %}
  </span>
  {% endif %}
</li>
