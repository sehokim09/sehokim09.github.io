pi:
  name: "Seho Kim"
  role: "Principal Investigator"
  photo: "/assets/img/people/seho-kim.jpg"
  titles:
    - "Assistant Professor, Hawaiʻi Institute of Geophysics and Planetology (HIGP)"
    - "Faculty Member, Hawaiʻi Space Flight Laboratory"
    - "Cooperating Graduate Faculty, Department of Earth Sciences"
  bio: >-
    Seho develops radio remote sensing techniques for Earth and planetary science — signals of opportunity,
    GNSS-Reflectometry and radio occultation — together with the mission design and small spacecraft that
    make the measurements. Before joining the University of Hawaiʻi at Mānoa in 2026, he was a Postdoctoral
    Fellow in the Radio Science and Solar System Radar Group at NASA's Jet Propulsion Laboratory (2023–2025).
  education:
    - "Ph.D., Aeronautics and Astronautics, Purdue University, 2023 — Dissertation: Multiple Signals of Opportunity for Land Remote Sensing"
    - "M.S., Electronic and Information Engineering, Korea Aerospace University, 2018"
    - "B.S., Electronics and Avionics Engineering, Korea Aerospace University, 2016 (magna cum laude)"

